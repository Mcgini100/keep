name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.github/engine-check-url', '.github/workflows/engine-check.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEEP_BUILD_NUMBER: ${{ github.run_number }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: app/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" 2>&1 | tee ../build.log

      - name: Report build errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          msg=$(grep -E "^e: |error:|What went wrong|FAILURE|> " build.log | grep -v "^> Task" | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Gradle build failed::${msg}"

      - name: Collect APK
        id: apk
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/app-release.apk ../dist/keep.apk
          ls -la ../dist
          echo "size=$(du -h ../dist/keep.apk | cut -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: keep-apk
          path: dist/keep.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Keep 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/keep.apk
          body: |
            Install on Android: download **keep.apk** below, open it, and allow installing from your browser if asked.
            Size: ${{ steps.apk.outputs.size }} · arm64 phones (almost every phone since 2017).
