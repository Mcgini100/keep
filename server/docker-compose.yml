services:
  keep:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Set a long random string and enter the same value in the app's Settings.
      KEEP_API_KEY: ${KEEP_API_KEY:-}
      KEEP_FILE_TTL: "3600"
      KEEP_MAX_CONCURRENT: "2"
      # Optional: Netscape-format cookies for private Instagram posts.
      # KEEP_COOKIES_FILE: /data/cookies.txt
    volumes:
      - keep-data:/data

volumes:
  keep-data:
