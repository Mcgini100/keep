plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.keepengine'
version = '1.0.0'

android {
  namespace "expo.modules.keepengine"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

// yt-dlp + Python + QuickJS, and ffmpeg, packaged for Android.
// https://github.com/yausername/youtubedl-android (GPL-3.0)
def youtubedlAndroid = "0.18.1"

dependencies {
  implementation "io.github.junkfood02.youtubedl-android:library:$youtubedlAndroid"
  implementation "io.github.junkfood02.youtubedl-android:ffmpeg:$youtubedlAndroid"
}
